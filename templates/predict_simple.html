<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        background: url('/static/images/image3.png') no-repeat center center fixed;
            background-size: cover;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .image-container {
            margin-bottom: 25px;
        }
        .image-container img {
            max-width: 280px;
            max-height: 280px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .result-card {
            background: linear-gradient(135deg, #9ec61a 0%, #8ba24b 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .result-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .confidence {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
        }
        .model-info {
            color: #666;
            font-size: 12px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e4da4e 0%, #9ec04f 100%);
            color: white;
            border: none;
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Analysis Complete</h1>
        
        <div class="image-container">
            <img src="{{ image_path }}" alt="Analyzed Image">
        </div>
        
        <div class="result-card">
            <div class="result-label">Detected Disease</div>
            <div class="result-value">{{ predicted_class }}</div>
            <div class="confidence">Confidence: {{ confidence }}</div>
        </div>
        
        <div class="model-info">
            Model: {{ model_name }}
        </div>
        
        <div class="buttons">
            <a href="/" class="btn btn-secondary">← New Analysis</a>
            <a href="/generate_report?filename={{ filename }}&predicted_class={{ predicted_class }}&confidence={{ confidence }}" class="btn btn-primary">📄 Download Report</a>
        </div>
    </div>
</body>
</html>
