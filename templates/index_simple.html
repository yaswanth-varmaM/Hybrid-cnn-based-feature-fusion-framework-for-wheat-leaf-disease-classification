<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheat Disease Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/green-1117267_640.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .model-badge {
            background: linear-gradient(135deg, #baf18d 0%, #61a24b 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 25px;
        }
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .upload-text {
            color: #666;
            margin-bottom: 10px;
        }
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .classes {
            margin-top: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        .classes h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .class-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .class-item {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #555;
        }
        #preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin: 15px auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Wheat Disease Detection using Hybrid and Swin Transformer</h1>
        <p class="subtitle">AI-Powered Plant Disease Classification</p>
        
        <div class="model-badge">{{ model_name }}</div>
        
        {% if request.args.get('error') %}
        <div class="error">{{ request.args.get('error') }}</div>
        {% endif %}
        
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label class="upload-area" for="file" id="dropArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">Click or drag image here</div>
                <div class="upload-hint">Supports: JPG, JPEG, PNG</div>
                <img id="preview" src="" alt="Preview">
            </label>
            <input type="file" name="file" id="file" accept=".jpg,.jpeg,.png" required onchange="showPreview(this)">
            
            <button type="submit" class="btn" id="submitBtn" disabled>
                Analyze Image
            </button>
        </form>
        
        <div class="classes">
            <h3>Detectable Diseases:</h3>
            <div class="class-list">
                {% for name in class_names %}
                <div class="class-item">{{ name }}</div>
                {% endfor %}
            </div>
        </div>
    </div>
    
    <script>
        function showPreview(input) {
            const preview = document.getElementById('preview');
            const submitBtn = document.getElementById('submitBtn');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    submitBtn.disabled = false;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        // Drag and drop
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('file');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        dropArea.addEventListener('drop', function(e) {
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                showPreview(fileInput);
            }
        });
    </script>
</body>
</html>
